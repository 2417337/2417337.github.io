    <header>
        <h1>★今日の星座占い★</h1>
        <p>あなたの星座を選んで、今日の運勢を占ってみよう！</p>
    </header>


    <main>
        <h2>星座を選んでください</h2>
        
        <button onclick="uranai(0)">おひつじ座</button>
        <button onclick="uranai(1)">おうし座</button>
        <button onclick="uranai(2)">ふたご座</button>
        <button onclick="uranai(3)">かに座</button>

        <button onclick="uranai(6)">てんびん座</button>
        <button onclick="uranai(7)">さそり座</button>
        <button onclick="uranai(8)">いて座</button>
        <button onclick="uranai(9)">やぎ座</button>
        <button onclick="uranai(10)">みずがめ座</button>
        <button onclick="uranai(11)">うお座</button>

        <div id="result">
            <p>ここに星座が表示されます</p>
            <p>今日の運勢：ここに運勢が表示されます</p>
            <p>ラッキーカラー：ここに色が表示されます</p>
            <p>ラッキーアイテム：ここにアイテムが表示されます</p>

        <button class="retry-button" onclick="reset()">もう一度占う</button>
